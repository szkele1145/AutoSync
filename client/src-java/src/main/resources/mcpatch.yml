# 更新服务器地址，可以填写多个备用地址，当一个不可用时会切换到备用地址上
# 目前支持的协议：http(s)、webdav(s)、msfp（自定义 TCP 文件传输协议）
#
# http协议的例子：（填写索引文件index.json所在的目录就好，不需要填写index.json本身）
#   1. http://127.0.0.1:6700 （走http协议）
#   2. https://127.0.0.1:6700/subfolder （走https协议）
#
# webdav协议的例子：（webdav代表走http协议，webdavs代表走https协议，要这样写只是为了和http源做区分）
#   1. webdav://user:pass:127.0.0.1:80   （webdav走http协议）
#   2. webdavs://user:pass:127.0.0.1:443 （webdav走https协议）
#   注：需要把user和pass这两个地方换成自己的账号密码，127.0.0.1换成主机地址，端口号不能省略
#
# msfp协议的例子：（自定义 TCP 文件传输协议，跑在裸 TCP 上，无需备案）
#   之所以不用 HTTP，是因为服务器在阿里云大陆节点时，未备案域名的 HTTP 流量会被拦截（403 Non-compliance ICP Filing），
#   而裸 TCP 不受影响。做内网穿透时请走普通 TCP 隧道而非 HTTP 隧道。
#   1. msfp://127.0.0.1:8123 （推荐写法）
#   2. 127.0.0.1:8123        （裸写法，端口省略时默认8123）
#
urls:
  - msfp://127.0.0.1:8123 # 若在公网部署记得换成自己的公网ip或者域名

# 记录客户端版本号文件的路径
# 客户端的版本号会被存储在这个文件里，并以此为依据判断是否更新到了最新版本
version-file-path: version-label.txt

# 当程序发生错误而更新失败时，是否可以继续进入游戏
# 如果为true，发生错误时会忽略错误，正常启动游戏，但是可能会因为某些新模组未下载无法进服
# 如果为false，发生错误时会直接崩溃掉Minecraft进程，停止游戏启动过程
# 此选项仅当程序以非图形模式启动时有效，因为在图形模式下，会主动弹框并将选择权交给用户
allow-error: false

# 在没有更新时，是否显示“资源文件暂无更新!”提示框
show-no-update-message: true

# 在有更新时，是否显示更新日志提示框
show-has-update-message: true

# 自动关闭更新日志的时间，单位为毫秒。设置为0代表不会自动关闭更新日志窗口，需要手点
auto-close-changelogs: 0

# 安静模式，是否只在下载文件时才显示窗口
# 如果为true，程序启动后在后台静默检查文件更新，而不显示窗口，若没有更新会直接启动Minecraft，
#            有更新的话再显示下载进度条窗口，此选项可以尽可能将程序的存在感降低（适合线上环境）
# 如果为false，每次都正常显示窗口（适合调试环境）
# 此选项仅当程序以图形模式启动时有效
silent-mode: false

# 是否禁用界面主题
# true: 禁用界面主题，可以解决窗口出现无响应的问题！
# false: 不会禁用界面主题，运行在某些机器上时可能会出现窗口出现无响应的问题！
disable-theme: false

# 窗口标题，可以自定义更新时的窗口标题
# 只有在桌面环境上时才有效，因为非桌面环境没法弹出窗口
window-title: AutoSync

# 更新的起始目录，也就是要把文件都更新到哪个目录下
# 默认情况下程序会智能搜索，并将所有文件更新到.minecraft父目录下（也是启动主程序所在目录），
# 这样文件更新的位置就不会随主程序文件的工作目录变化而改变了，每次都会更新在相同目录下。
# 如果你不喜欢这个智能搜索的机制，可以修改此选项来把文件更新到别的地方（十分建议保持默认不要修改）
# 1. 当此选项的值是空字符串''时，会智能搜索.minecraft父目录作为更新起始目录（这也是默认值）
# 2. 当此选项的值是'.'时，会把当前工作目录作为更新起始目录
# 3. 当此选项的值是'..'时，会把当前工作目录的上级目录作为更新起始目录
# 4. 当此选项的值是别的时，比如'ab/cd'时，会把当前工作目录下的ab目录里面的cd目录作为更新起始目录
base-path: ''

# 设置私有协议的超时判定时间，单位毫秒，值越小判定越严格
# 网络环境较差时可能会频繁出现连接超时，那么此时可以考虑增加此值（建议30s以下）
private-timeout: 7000

# 设置 http 系协议的连接超时判定时间，单位毫秒，值越小判定越严格
# 网络环境较差时可能会频繁出现连接超时，那么此时可以考虑增加此值（建议30s以下）
http-timeout: 7000

# 设置 MSFP（自定义 TCP 文件传输协议）的连接超时与读超时，单位毫秒，默认15000
# 连接超时指 TCP 建连最多等多久，读超时指两次收到数据之间最多等多久
# 只要还在持续收到数据就不会超时，所以可以放得比 http-timeout 宽松
tcp-timeout: 15000

# 多线程分块下载的线程数（也就是单个文件的最大分段数），默认32
# 只有文件大小超过 download-threshold 时才会分段，分段越多单文件越快，但占用的连接也越多
# 注意：最大连接数 ≈ concurrent-files × download-threads（默认 2 × 32 = 64），
#       走 frp 之类的隧道时不要再往上加，连接数打爆会被隧道 RST 掉，反而更慢
download-threads: 32

# 启用多线程分块下载的最小文件大小，单位字节，默认1MB
# 小于此值的文件直接单连接下载，因为分段带来的开销不划算
download-threshold: 1048576

# 文件级并发下载数，也就是同时下载多少个文件，默认2
# 原来是一个文件一个文件地串行下载，公网 RTT 下光是 SIZE 请求和 TCP 建连就要等很久，
# 打开文件级并发后可以把这个纯等待时间重叠掉
# 注意：最大同时在用的连接数大约是 concurrent-files × download-threads（小文件只占 1 条连接），
# 默认就是 2 × 32 = 64 条；隧道/家宽条件一般时保持 2，网络很好最多加到 3~4（96~128 条），不建议再高
concurrent-files: 2

# 是否优先用清单里的 CDN 链接（http/https 绝对地址）下载文件，默认 true
# 注意：新版已经被下面的 source-mode 取代，这一项只是为了兼容老配置文件与旧版本客户端才保留的，
# 等价关系是：prefer-cdn: true -> source-mode: cdn，prefer-cdn: false -> source-mode: server
# 两个都写了的时候以 source-mode 为准，这一项被忽略（示例里保留它，是为了同目录配置拿去给旧版客户端也能跑）
# true：每个文件先按清单 urls 里的 CDN 直链下载（同样走 Range 分块并发），下载完照常校验 SHA-256；
#       任何一步失败（连不上/超时/4xx/5xx/哈希不符）都会自动回退到下面 urls 里的更新源，不影响整体同步
# false：完全忽略清单里的绝对链接，所有文件都走更新源（改动前的旧行为）
# 日志里可以看到：[CDN] xxx.jar 从 cdn.modrinth.com 下载成功 / [CDN] xxx.jar 失败（原因），回退服务端
prefer-cdn: true

# 下载来源模式，默认 auto。auto / cdn / server 三选一
#   auto  ：每次同步开始时先测速一次（CDN 与服务端并发各下一段同一个大文件），按速度自动选本次用哪个来源下载；
#           结果按 source-cache-seconds 缓存，缓存没过期时直接复用、不再测速
#   cdn   ：不测速，直接用清单里的 CDN 直链；CDN 失败仍然会自动回退服务端，不影响整体同步
#   server：不测速，完全不碰 CDN，所有文件都走下面 urls 里的更新源
# 日志里能看到（更多说明见 README.md 的「CDN / 服务端 自动测速选源」一节）：
#   [测速] 样本 Flashback-0.39.10-for-MC1.21.1.jar（201.00 MB，本次待下载）
#   [测速] CDN 3.21 MB/s  |  服务端 1.42 MB/s  ->  选 CDN（达服务端 226%）
source-mode: auto

# 测速样本的最小体积，单位 MB，默认 10
# 只有体积不小于它的文件才会被挑出来当测速样本，太小的文件几毫秒就下完了，测不出真实带宽
# 优先从本次待下载列表里挑最大的那个；一个待下载的大文件都没有（都已是最新）时，
# 会退而求其次挑一个本地已有的大文件做「影子样本」，只下载临时片段，绝不改动用户的真实文件
speedtest-min-size-mb: 10

# 每个来源的测速时长，单位毫秒，默认 2000
# CDN 与服务端是并发测的，各自在这个时间窗口里传了多少字节就换算成多少 MB/s
# 调大更准但更慢，调小更快但更容易被网络抖动影响
# 流量上限：一次测速每个来源最多读 8MB（单条连接最多 1MB），所以就算时长和线程数都拉满也不会失控
speedtest-duration-ms: 2000

# CDN 速度达到服务端的这个比例就算「够快」，直接选 CDN，默认 0.5
# 判据：cdn_speed >= server_speed × cdn-prefer-ratio
# 0.5 表示 CDN 只要有服务端一半快就用 CDN（优先省服务端带宽，差距可以接受）；
# 调到 1 表示「CDN 必须不比服务端慢才用它」；调到 0 表示永远优先用 CDN
cdn-prefer-ratio: 0.5

# CDN 测速太慢时提线程重测的上限，默认 64
# 第一次测速按 download-threads 条连接并发；一旦判定 CDN 太慢，会先把连接数翻倍（32 -> 64）再测一次，
# 因为很多 CDN 是按单连接限速的，加连接就能提速；重测还是不如服务端才最终选服务端
# 这个值不大于 download-threads 时等于关掉「提线程重测」
cdn-max-threads: 64

# 强制走更新源、不尝试 CDN 的文件名单，默认空列表
# 每一项可以是文件名通配（Flashback-*.jar、*.jar）或相对路径（mods/xxx.jar、mods/lib/*.jar），
# 支持 * 和 ? 通配，匹配时不区分大小写；带 / 的按清单里的完整路径匹配，不带的只按文件名匹配
# 用途：自托管、CDN 上本来就没有的文件，省掉一次注定失败的 CDN 请求
# 命中时日志会打印：[服务端] xxx.jar（命中 cdn-exclude）
cdn-exclude: []
#  cdn-exclude:
#    - Flashback-*.jar
#    - mods/lib/*.jar

# CDN 直链下载的连接超时与读超时，单位毫秒，默认15000
# 与 tcp-timeout 同理：只要还在持续收到数据就不会超时，避免某个慢 CDN 卡住整个同步
cdn-timeout: 15000

# 是否在启动时对所有更新源并发测速（PING 测 RTT + 下载测速文件测吞吐），并自动选择最优源
# 关闭后退回原来的行为：按 urls 的顺序依次尝试
auto-select-source: true

# 手动锁定的更新源，填写后跳过自动测速，只用这一个源（留空表示不锁定）
# 例如 manual-source: 'msfp://127.0.0.1:8170'
manual-source: ''

# 测速结果的缓存时间，单位秒，默认3600
# 缓存未过期时直接复用上次的测速结果，避免每次启动都重新测速
source-cache-seconds: 3600

# 单个更新源测速的超时时间，单位毫秒，默认5000
# 所有源是并发测速的，某一个源超时不会拖累其它源
source-probe-timeout: 5000

# 测速文件名，相对于更新源根目录，默认 speedtest.bin（建议 256KB ~ 1MB）
# 该文件不存在时，该源降级为只测 RTT，不影响它参与选优
source-speedtest-file: speedtest.bin

# 综合评分公式：score = 速度(MB/s) × source-weight-speed + (1000 / max(rtt,1)) × source-weight-latency
# 默认偏向吞吐，因为玩家的痛点是下载慢
source-weight-speed: 0.8
source-weight-latency: 0.2

# 为 http 系协议设置 headers
http-headers:
#  User-Agent: This filled by youself # 这是一个自定义UserAgent的配置示例

# 出现网络问题时的重试次数，适用于所有协议，最大值不建议超过100<p>
# 当服务器没有及时响应数据时，会消耗1次重试次数，然后进行重新连接<p>
# 当所有的重试次数消耗完后，程序才会真正判定为超时，并弹出网络错误对话框<p>
# 建议 timeout * retries 的总时间控制在20秒以内，避免玩家等的太久
retries: 3

# 设置 http 系协议是否忽略SSL证书验证
ignore-ssl-cert: false

# 测试模式，专门用来调试更新时的网速
# 开启后每次都会重头更新，且不会优化任何文件下载
# 仅用于测试用途，平时正常使用勿开
test-mode: false

# 是否检测并自动禁用与服务器托管模组 modId 冲突的玩家自加模组
# 开启后，如果 mods 目录里存在与清单里某个托管模组 modId 相同的玩家自加 jar，
# 会把玩家自加的那个重命名为 xxx.jar.disabled，避免 NeoForge 因 Duplicate mod 直接崩溃
# 注意：同 modId 的模组如果全都是玩家自加的（清单里没有），则无法判断该留哪个，只会打日志警告
detect-mod-conflicts: true

# 镜像模式：是否让客户端 mods 目录与服务端清单「完全一致」
# false（默认）：保持原有行为，只维护清单里列出的文件（缺了下载、哈希不符重下、deletes 里列出的删除），
#               清单外的文件一概不碰，玩家自己加的 mod 会被保留
# true：镜像模式，mods 目录里所有不在清单白名单中的文件（含 xxx.jar.disabled）都会被清理，
#       保证客户端 mods 目录与服务端清单严格对应。清理发生在所有更新文件都下载应用完成之后。
# 安全兜底：如果清单里一个 mods/ 开头的条目都没有，客户端绝不会执行清理，只会打警告并跳过，
#           避免服务端清单配错时把玩家的 mods 目录清空
mirror-mode: false

# 镜像模式下清理清单外文件的方式
# true（默认）：移动到备份目录 <游戏目录>/.modsync-removed/ 下（保留相对路径结构，同名冲突时加时间戳后缀），
#               被清掉的文件可以随时人工找回
# false：直接删除，不可恢复
mirror-backup: true